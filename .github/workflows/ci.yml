name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy — pass a previous commit sha to roll back"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # A failing test fails this job, and everything downstream is skipped — nothing deploys.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Every merged change is tagged with its commit sha, so any image is exactly reproducible —
  # and any earlier sha is one `docker compose up -d` away (the rollback).
  build:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag (commit sha, or the tag given for a manual run)
        id: tag
        run: echo "tag=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest

  # Deploy only runs after a green test + push. It stops dead if the health check fails.
  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and wait for /health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/tidewater-api
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export IMAGE_TAG="${{ inputs.tag || github.sha }}"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull server
            docker compose up -d server
            for i in $(seq 1 12); do
              curl -fsS http://localhost:3000/health && { echo "healthy"; exit 0; }
              sleep 5
            done
            echo "health check failed after deploy" && exit 1
