name: tidewater-api

services:
  server:
    # Deployed from the registry (IMAGE_TAG = commit sha, set by the pipeline or by hand);
    # the build section stays so `pnpm docker:up` still works for local development.
    image: ghcr.io/${GITHUB_REPOSITORY:-you/tidewater-api}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
